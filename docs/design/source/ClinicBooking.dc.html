<style>

.slot{height:42px;border-radius:12px;border:1px solid #E7DBD1;background:#FFFCF7;font-family:inherit;font-size:14px;font-weight:600;color:#231A18}

<div style="flex-grow: 1"><div style="font-size: 15px; font-weight: 700">جلسة علاج طبيعي · <bdi>45</bdi> د</div><div style="font-size: 12px; color: #6B5E59">محمد سالم · مركز حركة</div></div>

<div style="display: flex; gap: 6px; margin: 10px 20px 0; background: #EFE5DC; border-radius: 14px; padding: 4px">

<div style="text-align: end"><div style="font-size: 11px; color: #6B5E59">عليك</div><div dir="ltr" style="font-size: 15px; font-weight: 700">QAR 60</div></div>

<div style="position: absolute; bottom: 0; right: 0; left: 0; background: #FFFCF7; border-top: 1px solid #E7DBD1; padding: 14px 20px 30px">

<a href="Hub.dc.html" style="height: 54px; border-radius: 16px; background: #2F6B67; color: #FFFFFF; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none">تأكيد الموعد</a>
<div style="font-size: 11px; color: #6B5E59; text-align: center; margin-top: 8px">تذكير قبل الموعد بـ <bdi>24</bdi> ساعة وساعتين · الإلغاء مجاني قبل <bdi>12</bdi> ساعة</div>
</div>
